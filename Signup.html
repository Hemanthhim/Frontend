<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .error {
        color: red;
      }
      /* Background */
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(to bottom, #1a1635, #2c2359);
}

/* Signup form container */
form {
  background: #020063;
  padding: 40px 30px;
  border-radius: 12px;
  width: 350px;
  text-align: center;
  color: #fff;
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
  position: relative;
  overflow: visible;
}

/* Title */
form h1 {
  margin-bottom: 25px;
  font-size: 24px;
  font-weight: 600;
}

/* Labels */
label {
  display: block;
  text-align: left;
  margin: 12px 0 6px;
  font-size: 14px;
  font-weight: 500;
}

/* Inputs */
input {
  width: 100%;
  padding: 12px;
  border-radius: 8px;
  border: none;
  font-size: 14px;
  margin-bottom: 10px;
  outline: none;
  background: #f1f1f1;
}

input:focus {
  border: 1px solid #764ba2;
  box-shadow: 0 0 6px rgba(118, 75, 162, 0.6);
}

/* Buttons */
button {
  width: 100%;
  padding: 12px;
  margin-top: 12px;
  border: none;
  border-radius: 6px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
}

button[type="submit"] {
  background: linear-gradient(90deg, #764ba2, #667eea);
  color: #fff;
}

button[type="reset"] {
  background: #ddd;
  color: #333;
}

button:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 14px rgba(0, 0, 0, 0.25);
}

/* Error messages */
.error {
  color: #ff6b6b;
  font-size: 12px;
  display: block;
  text-align: left;
  margin-top: -6px;
  margin-bottom: 6px;
}


    </style>
  </head>
  <body>
    <form action="">
      <div class="container">
        <h1>Signup</h1>
      </div>
      <div>
        <label for="user">Username</label>
        <input type="text" id="user" name="user" />
        <span id="userError" class="error"></span>
        <br />
        <label for="pass">Password</label>
        <input type="text" id="pass" name="pass" />
        <span id="passError" class="error"></span>
        <br />
        <label for="">confirm password</label>
        <input type="text" id="cPass" name="cPass" />
        <span id="cPassError" class="error"></span>
        <br />
        <label for="mail">Email-ID</label>
        <input type="email" id="mail" name="mail" />
        <span id="mailError" class="error"></span>
        <br />
        <label for="num">Number</label>
        <input type="number" id="num" name="num" />
        <span id="numError" class="error"></span>
        <br />
        <button type="submit">sign Up</button>
        <button type="reset">Cancel</button>
      </div>
    </form>

    <script src="signup.js"></script>
  </body>
</html>
