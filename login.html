<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .error{
        color: red;
      }
      /* Background */
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #112fb4, #d5eb0f, #ff6ec4);
}

/* Container (form card) */
form {
  background: #fff;
  padding: 40px 35px;
  border-radius: 12px;
  width: 350px;
  box-shadow: 0 6px 25px rgba(0, 0, 0, 0.15);
  text-align: center;
  animation: fadeIn 0.8s ease-in-out;
}

/* Title */
form > div:first-child {
  font-size: 24px;
  font-weight: 600;
  margin-bottom: 20px;
  color: #333;
}

/* Labels */
label {
  display: block;
  text-align: left;
  font-size: 14px;
  margin: 12px 0 6px;
  font-weight: 500;
  color: #444;
}

/* Inputs */
input {
  width: 100%;
  padding: 12px;
  border-radius: 8px;
  border: 1px solid #ddd;
  font-size: 14px;
  outline: none;
  transition: border 0.3s, box-shadow 0.3s;
}

input:focus {
  border-color: #667eea;
  box-shadow: 0 0 6px rgba(102, 126, 234, 0.5);
}

/* Buttons */
button {
  width: 48%;
  padding: 12px;
  margin-top: 18px;
  border: none;
  border-radius: 25px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

/* Login button with gradient */
button[type="submit"] {
  background: linear-gradient(90deg, #667eea, #1e1eea);
  color: #fff;
}

button[type="reset"] {
  background: #f1f5f9;
  color: #333;
}

button:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 10px rgba(0,0,0,0.15);
}

/* Error messages */
.error {
  color: red;
  font-size: 12px;
  display: block;
  margin-top: 5px;
}

/* Animation */
@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(-20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}


    </style>
  </head>
  <body>
    <form action="">
      <div class="container">login Page</div>
      <div>
        <label for="">Email</label>
        <input type="email" id="mail">
        <span id="mailError" class="error"></span>
        <br />
        <label for="">Password</label>
        <input type="text" id="pass" >
        <span id="passError" class="error"></span>

        <button type="submit">login</button>
        <button type="reset">cancel</button>
        
      </div>
    </form>

    <script>
      let loginForm = document.querySelector("form");
      loginForm.addEventListener("submit", (e) => {
        let mail = document.getElementById("mail").value.trim();
        let pass = document.getElementById("pass").value.trim();

        document.getElementById("mailError").innerHTML = "";
        document.getElementById("passError").innerHTML = "";

        let valid = true;
        e.preventDefault();

        if (mail === "") {
          document.getElementById("mailError").innerText =
            "mail id is mandatory";
          valid = false;
        }
        let mailEr = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;
        if (!mail.match(mailEr)) {
          document.getElementById("mailError").innerText =
            "enter valid mail Id";
          valid = false;
        }

        if (pass === "") {
          document.getElementById("passError").innerText =
            "password is manadatory";
          valid = false;
        }
        if (pass.length < 6 || pass.length > 15) {
          document.getElementById("passError").innerText =
            "password should between 6 to 15 characters";
          valid = false;
        }

        if (valid) {
          let user = JSON.parse(localStorage.getItem("signupData"));
          if (!user) {
            alert("no user found");
          }
          if (mail === user.Email && pass === user.password) {
            alert("login succesfull");
            window.location.href = "Home.html";
          } else {
            alert("invalid credentials");
          }
        }
      });
    </script>
  </body>
</html>
